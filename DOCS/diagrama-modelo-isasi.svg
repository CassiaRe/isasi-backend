<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 1470" width="2100" height="1470" role="img" aria-labelledby="title desc"><title id="title">Modelo MongoDB: Isasi Muebles, usuarios, presupuestos y materiales</title><desc id="desc">Usuarios se relaciona uno a muchos con Presupuestos mediante usuarioId. Presupuestos contiene de uno a muchos ítems como objetos embebidos en el array items. Cada ítem referencia un Material mediante materialId y un material puede usarse en muchos ítems. Solo hay tres colecciones.</desc>
